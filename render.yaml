# Render Blueprint — CreatorGrowth (free tier)
# Raat ko: Render dashboard → New → Blueprint → ye repo select karo. Bas.

databases:
  - name: creatorgrowth-db
    plan: free

services:
  # ── Backend API (FastAPI) ──────────────────────────────────────────────
  - type: web
    name: creatorgrowth-api
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: creatorgrowth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://creatorgrowth-web.onrender.com
      - key: LOGIN_RATE_LIMIT
        value: 20/minute
      - key: REGISTER_RATE_LIMIT
        value: 30/hour

  # ── Frontend (React static site) ───────────────────────────────────────
  - type: web
    name: creatorgrowth-web
    runtime: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://creatorgrowth-api.onrender.com
